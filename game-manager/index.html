<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Soccer Game Day Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="view-container"></div>
    <nav id="bottom-nav">
      <button class="nav-tab" data-view="dashboard">
        <span class="nav-icon">&#9776;</span>
        <span class="nav-label">Dashboard</span>
      </button>
      <button class="nav-tab" data-view="roster">
        <span class="nav-icon">&#128100;</span>
        <span class="nav-label">Roster</span>
      </button>
      <button class="nav-tab nav-tab--live" data-view="live">
        <span class="nav-icon">&#9917;</span>
        <span class="nav-label">Live</span>
      </button>
    </nav>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden"></div>
  <div id="modal-container" class="modal-container hidden"></div>

  <script src="js/data.js"></script>
  <script src="js/recommend.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
